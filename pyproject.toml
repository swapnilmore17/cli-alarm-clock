[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-alarm-clock"
version = "0.1.0"
description = "A minimal macOS command-line alarm clock"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alarm = "alarm_clock.cli:main"

[tool.setuptools.package-data]
alarm_clock = ["assets/*.wav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
